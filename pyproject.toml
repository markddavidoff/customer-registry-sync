[project]
name = "customer-registry-sync"
version = "0.1.0"
description = "Build a customer registry dataset from Notion pages and sync it to Linear customers as code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Davidoff" }]
requires-python = ">=3.12"
dependencies = [
    "gitops-engine",
    "notion-client>=2.2",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
]

[project.scripts]
customer-registry-sync = "customer_registry_sync.cli:main"

[tool.uv.sources]
gitops-engine = { path = "../../../../gitops-engine/.claude/worktrees/engine-v0.2", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_registry_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits a real Linear workspace (needs --run-live and LINEAR_API_TOKEN)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's long-standing default rule set, pinned so a ruff upgrade does not change the gate.
select = ["E4", "E7", "E9", "F"]
