# Copy to .github/workflows/registry-sync.yml in the repository that holds the
# registry. Only the cron time and the caller-side secret names may differ between
# repositories; the data directory and both environment names live in
# registry-sync.yaml under `workflow:`.
#
# - GitHub can call this reusable workflow only when the customer-registry-sync
#   repository is public, or has the same owner as this repository (and allows
#   Actions access from it). That repository is private today, so a caller in
#   another owner cannot use it until it is made public.
# - No release tag exists yet. Replace `@main` below with `@<full commit sha>`,
#   the same commit your pyproject.toml pins with `rev`, until a tag is published.
# - Secrets are passed explicitly by name: `secrets: inherit` passes nothing to a
#   workflow owned by another account. Map the names on the left (fixed by the
#   reusable workflow) to your own secrets on the right. A secret with the
#   left-hand name stored in the deploy or read-only environment takes precedence,
#   so the Linear tokens can live behind the approval gate.
# - There is no `paths:` filter: GitHub cannot read the deploy inputs from the
#   config. Every push to main starts a run; its first job installs the tool
#   (a `uv sync`) and then ends the run when no deploy input changed.
name: registry-sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy: apply the registry; restore: put back values from a snapshot; e2e: run the live GitOps test; refresh: re-read Linear and open a PR with the refreshed files"
        type: choice
        options: [deploy, restore, e2e, refresh]
        default: deploy
      snapshot:
        description: "restore only: snapshot file under <data_dir>/linear-snapshots/, relative to the repository root (it must already be on main, merged via a state PR)"
        type: string
        required: false
      rows:
        description: "restore only: space-separated external ids to restore (empty restores every row)"
        type: string
        required: false

jobs:
  registry-sync:
    # `@main` is a placeholder: pin a commit sha here (see the note at the top).
    uses: markddavidoff/customer-registry-sync/.github/workflows/registry-sync.yml@main
    permissions:
      contents: read
    secrets:
      LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
      LINEAR_READONLY_TOKEN: ${{ secrets.LINEAR_READONLY_TOKEN }}
      REGISTRY_SYNC_APP_ID: ${{ secrets.REGISTRY_SYNC_APP_ID }}
      REGISTRY_SYNC_APP_PRIVATE_KEY: ${{ secrets.REGISTRY_SYNC_APP_PRIVATE_KEY }}
      REGISTRY_SYNC_SSH_KEY: ${{ secrets.REGISTRY_SYNC_SSH_KEY }}
    with:
      mode: ${{ inputs.mode }}
      snapshot: ${{ inputs.snapshot }}
      rows: ${{ inputs.rows }}
