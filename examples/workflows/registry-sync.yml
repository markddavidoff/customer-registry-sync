# Copy to .github/workflows/registry-sync.yml in the repository that holds the
# registry. Only the cron time may differ between repositories; every setting
# (data directory, environments, secret names) lives in registry-sync.yaml under
# `workflow:`. Pin `uses:` to a release tag or commit of customer-registry-sync.
#
# There is no `paths:` filter: GitHub cannot read the deploy inputs from the
# config, so every push to main starts a run, and its first job ends it in
# seconds when no deploy input changed.
name: registry-sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy: apply the registry; restore: put back values from a snapshot; e2e: run the live GitOps test; refresh: re-read Linear and open a PR with the refreshed files"
        type: choice
        options: [deploy, restore, e2e, refresh]
        default: deploy
      snapshot:
        description: "restore only: snapshot file under <data_dir>/linear-snapshots/, relative to the repository root (it must already be on main, merged via a state PR)"
        type: string
        required: false
      rows:
        description: "restore only: space-separated external ids to restore (empty restores every row)"
        type: string
        required: false

jobs:
  registry-sync:
    uses: markddavidoff/customer-registry-sync/.github/workflows/registry-sync.yml@main
    permissions:
      contents: read
    # Secret names come from registry-sync.yaml, so the reusable workflow reads them
    # by name; `inherit` makes the repository and organization secrets visible to it.
    secrets: inherit
    with:
      mode: ${{ inputs.mode }}
      snapshot: ${{ inputs.snapshot }}
      rows: ${{ inputs.rows }}
