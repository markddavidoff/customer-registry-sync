# Copy to .github/workflows/registry-sync.yml in the repository that holds the
# registry. Only the cron time and the caller-side secret names may differ between
# repositories; the data directory and both environment names live in
# registry-sync.yaml under `workflow:`.
#
# - The reusable workflow is gitops-engine's sync workflow. GitHub can call it from
#   any repository because gitops-engine is public. It installs this tool from the
#   `tool` requirement below, so the tag in that line pins the tool; keep it on the
#   same release as the workflow's `@v0.2.0`.
# - Secrets are passed explicitly by name: `secrets: inherit` passes nothing to a
#   workflow owned by another account. Map the names on the left (fixed by the
#   reusable workflow) to your own repository or organization secrets on the right.
#   The left-hand names contain a hyphen, so an environment secret cannot shadow
#   them; keep the tokens as repository secrets, and restrict who may run the
#   deploy through the deploy environment's required reviewers.
# - There is no `paths:` filter: GitHub cannot read the deploy inputs from the
#   config. Every push to main starts a run; its first job installs the tool
#   (a `uv tool install`) and then ends the run when no deploy input changed.
name: registry-sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy: apply the registry; restore: put back values from a snapshot; e2e: run the live GitOps test; refresh: re-read Linear and open a PR with the refreshed files"
        type: choice
        options: [deploy, restore, e2e, refresh]
        default: deploy
      snapshot:
        description: "restore only: snapshot file under <data_dir>/linear-snapshots/, relative to the repository root (it must already be on main, merged via a state PR)"
        type: string
        required: false
      rows:
        description: "restore only: space-separated external ids to restore (empty restores every row)"
        type: string
        required: false

jobs:
  registry-sync:
    uses: markddavidoff/gitops-engine/.github/workflows/sync.yml@v0.2.0
    permissions:
      contents: read
    secrets:
      destination-token: ${{ secrets.LINEAR_API_TOKEN }}
      destination-readonly-token: ${{ secrets.LINEAR_READONLY_TOKEN }}
      app-id: ${{ secrets.REGISTRY_SYNC_APP_ID }}
      app-private-key: ${{ secrets.REGISTRY_SYNC_APP_PRIVATE_KEY }}
    with:
      tool: "customer-registry-sync @ git+https://github.com/markddavidoff/customer-registry-sync.git@v0.2.0"
      command: customer-registry-sync
      config: registry-sync.yaml
      token-env: LINEAR_API_TOKEN
      mode: ${{ inputs.mode }}
      snapshot: ${{ inputs.snapshot }}
      rows: ${{ inputs.rows }}
